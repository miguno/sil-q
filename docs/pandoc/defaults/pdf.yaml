# PDF build options.
# Invoke pandoc from `docs/` so all relative paths resolve.

from: markdown
input-files:
  - user/manual.md
output-file: dist/Sil-Q-Manual.pdf
resource-path:
  - user
  - .
pdf-engine: xelatex
template: pandoc/templates/eisvogel/eisvogel
include-in-header:
  - pandoc/assets/pdf-header.tex
toc: true
highlight-style: tango

variables:
  book: true
  titlepage: true
  titlepage-text-color: "000000"
  titlepage-background: pandoc/assets/sil-title-image.jpg
  titlepage-rule-height: 0
  toc-own-page: true
  footer-center: "Sil-Q Manual 1.5.1-beta1 (generated 2026-XX-XX)"
  code-block-font-size: '\footnotesize'
  # XeLaTeX picks up the local Lora TTFs from pandoc/assets/fonts/lora/.
  mainfont: "Lora"
  mainfontoptions:
    - "Path=pandoc/assets/fonts/lora/"
    - "Extension=.ttf"
    - "UprightFont=*-Regular"
    - "BoldFont=*-Bold"
    - "ItalicFont=*-Italic"
    - "BoldItalicFont=*-BoldItalic"
